        -----END CERTIFICATE-----
      key: |
        -----BEGIN EC PRIVATE KEY-----
        MHcCAQEEIHNn8KTW/ez3FmKQpxl6cQgXYMKwAgsVczQYos0dDBTfoAoGCCqGSM49
        AwEHoUQDQgAE4YR/f9g8Ol269ODml5bjUVHnUAPptglgo0JFssE5pBN09fAk9xHi
        CLghxSBGjvmM7x9eNBIyNVDj/8ivAISJag==
        -----END EC PRIVATE KEY-----
    leaf2:
      crt: |
        -----BEGIN CERTIFICATE-----
        MIIB3DCCAYKgAwIBAgIJAO0kDqNrZKeZMAoGCCqGSM49BAMCMEAxCzAJBgNVBAYT
        AkFUMRUwEwYDVQQKDAxBTlNJQkxFIFRFU1QxGjAYBgNVBAMMEUFOU0lCTEUtVEVT
        VC1DQS0xMB4XDTI2MDgwOTEwMjEwM1oXDTQ2MDgwNDEwMjEwM1owTDELMAkGA1UE
