---

- name: Testing Trust CAs
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.list:
      target: 'trust_ca'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: >
        'data' not in opn_pre1 or
        opn_pre1.data | selectattr('descr', 'match', '^ANSIBLE_TEST_') | list | length != 0

    - name: Removing - does not exist
      oxlorg.opnsense.trust_ca:
        description: 'ANSIBLE_TEST_1_1'
        state: 'absent'
      register: opn_pre2
      failed_when: >
        opn_pre2.failed or
        opn_pre2.changed

    - name: Adding 1 - failing because of missing country
      oxlorg.opnsense.trust_ca:
        description: 'ANSIBLE_TEST_1_1'
      register: opn_fail1
      failed_when: not opn_fail1.failed

    - name: Adding 1 - failing because of invalid issuer
      oxlorg.opnsense.trust_ca:
        description: 'ANSIBLE_TEST_1_1'
        country: 'AT'
        ca: 'ANSIBLE_TEST_DOES_NOT_EXIST'
      register: opn_fail2
      failed_when: not opn_fail2.failed

    - name: Adding 1
      oxlorg.opnsense.trust_ca:
        description: 'ANSIBLE_TEST_1_1'
        common_name: 'Ansible Test CA'
        country: 'AT'
        state_or_province: 'Styria'
        city: 'Graz'
        organization: 'OXL IT Services'
        key_type: 'secp521r1'
        lifetime: 36500
      register: opn1
      failed_when: >
        opn1.failed or
        not opn1.changed

    - name: Adding 1 - nothing changed
      oxlorg.opnsense.trust_ca:
        description: 'ANSIBLE_TEST_1_1'
        common_name: 'Ansible Test CA'
        country: 'AT'
        state_or_province: 'Styria'
        city: 'Graz'
        organization: 'OXL IT Services'
        key_type: 'secp521r1'
        lifetime: 36500
      register: opn2
      failed_when: >
        opn2.failed or
        opn2.changed
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_list1
      when: not ansible_check_mode

    - name: Changing 1 - failing because the CA would need to be re-issued
      oxlorg.opnsense.trust_ca:
        description: 'ANSIBLE_TEST_1_1'
        common_name: 'Ansible Test CA'
        country: 'AT'
        state_or_province: 'Styria'
        city: 'Graz'
        organization: 'OXL IT Services'
        key_type: '4096'
        lifetime: 36500
      register: opn_fail3
      failed_when: not opn_fail3.failed
      when: not ansible_check_mode

    - name: Changing 1 - renaming
      oxlorg.opnsense.trust_ca:
        description: 'ANSIBLE_TEST_1_2'
        common_name: 'Ansible Test CA'
        country: 'AT'
        state_or_province: 'Styria'
        city: 'Graz'
        organization: 'OXL IT Services'
        key_type: 'secp521r1'
        lifetime: 36500
        match_fields: ['common_name']
      register: opn3
      failed_when: >
        opn3.failed or
        not opn3.changed
      when: not ansible_check_mode

    - name: Listing - CA was not re-issued
      oxlorg.opnsense.list:
      register: opn_list2
      failed_when: >
        'data' not in opn_list2 or
        opn_list2.data | selectattr('descr', 'equalto', 'ANSIBLE_TEST_1_2') | list | length != 1 or
        (opn_list2.data | selectattr('descr', 'equalto', 'ANSIBLE_TEST_1_2') | first).refid !=
        (opn_list1.data | selectattr('descr', 'equalto', 'ANSIBLE_TEST_1_1') | first).refid or
        (opn_list2.data | selectattr('descr', 'equalto', 'ANSIBLE_TEST_1_2') | first).valid_from !=
        (opn_list1.data | selectattr('descr', 'equalto', 'ANSIBLE_TEST_1_1') | first).valid_from or
        (opn_list2.data | selectattr('descr', 'equalto', 'ANSIBLE_TEST_1_2') | first).prv_payload is defined
      when: not ansible_check_mode

    - name: Adding 2 - intermediate CA
      oxlorg.opnsense.trust_ca:
        description: 'ANSIBLE_TEST_1_3'
        common_name: 'Ansible Test Intermediate CA'
        country: 'AT'
        ca: 'ANSIBLE_TEST_1_2'
      register: opn4
      failed_when: >
        opn4.failed or
        not opn4.changed
      when: not ansible_check_mode

    - name: Adding 2 - nothing changed
      oxlorg.opnsense.trust_ca:
        description: 'ANSIBLE_TEST_1_3'
        common_name: 'Ansible Test Intermediate CA'
        country: 'AT'
        ca: 'ANSIBLE_TEST_1_2'
      register: opn5
      failed_when: >
        opn5.failed or
        opn5.changed
      when: not ansible_check_mode

    - name: Removing 1 - failing because it is still in use
      oxlorg.opnsense.trust_ca:
        description: 'ANSIBLE_TEST_1_2'
        state: 'absent'
      register: opn_fail4
      failed_when: not opn_fail4.failed
      when: not ansible_check_mode

    - name: Removing 2
      oxlorg.opnsense.trust_ca:
        description: 'ANSIBLE_TEST_1_3'
        state: 'absent'
      register: opn6
      failed_when: >
        opn6.failed or
        not opn6.changed
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_list3
      failed_when: >
        'data' not in opn_list3 or
        opn_list3.data | selectattr('descr', 'match', '^ANSIBLE_TEST_') | list | length != 1
      when: not ansible_check_mode


    # --- importing an externally-issued CA -----------------------------------
    # Self-signed throwaway CAs, valid until 2126 so the test does not rot.
    # The API runs openssl_x509_parse on these, so they have to be real.
    - name: 'Adding 4 - failing because the certificate is not a PEM certificate'
      oxlorg.opnsense.trust_ca:
        description: 'ANSIBLE_TEST_1_4'
        certificate: 'not-a-certificate'
