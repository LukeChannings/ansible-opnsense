    - name: 'Adding 4 - nothing changed'
      oxlorg.opnsense.trust_ca:
        description: 'ANSIBLE_TEST_1_4'
        certificate: |
          -----BEGIN CERTIFICATE-----
          MIICczCCAhoCCQCWqWGNrfAs1jAKBggqhkjOPQQDAjBHMQswCQYDVQQGEwJBVDEV
          MBMGA1UECgwMQW5zaWJsZSBUZXN0MSEwHwYDVQQDDBhBTlNJQkxFX1RFU1RfSU1Q
