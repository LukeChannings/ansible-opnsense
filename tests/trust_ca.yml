    - name: 'Changing 4 - nothing changed after the rotation'
      oxlorg.opnsense.trust_ca:
        description: 'ANSIBLE_TEST_1_4'
        certificate: |
          -----BEGIN CERTIFICATE-----
          MIICdDCCAhoCCQCOTrpoTTu1+DAKBggqhkjOPQQDAjBHMQswCQYDVQQGEwJBVDEV
