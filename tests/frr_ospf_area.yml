---

- name: Testing FRR-OSPF areas
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.list:
      target: 'frr_ospf_area'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: >
        'data' not in opn_pre1 or
        opn_pre1.data | length != 0

    - name: Removing - does not exist
      oxlorg.opnsense.frr_ospf_area:
        area: '0.0.0.1'
        state: 'absent'
      register: opn_pre2
      failed_when: >
        opn_pre2.failed or
        opn_pre2.changed

    - name: Adding 1 - failing because of a decimal area-id
      oxlorg.opnsense.frr_ospf_area:
        area: '1'
      register: opn_fail1
      failed_when: not opn_fail1.failed

    - name: Adding 1 - failing because of an IPv6 range
      oxlorg.opnsense.frr_ospf_area:
        area: '0.0.0.1'
        ranges: ['2001:db8:1::/48']
      register: opn_fail2
      failed_when: not opn_fail2.failed

    - name: Adding 1 - failing because of an unknown prefix-list
      oxlorg.opnsense.frr_ospf_area:
        area: '0.0.0.1'
        prefix_list_in: 'ANSIBLE_TEST_DOES_NOT_EXIST'
      register: opn_fail3
      failed_when: not opn_fail3.failed

    - name: Adding 1
      oxlorg.opnsense.frr_ospf_area:
        area: '0.0.0.1'
      register: opn1
      failed_when: >
        opn1.failed or
        not opn1.changed

    - name: Adding 1 - nothing changed
      oxlorg.opnsense.frr_ospf_area:
        area: '0.0.0.1'
      register: opn2
      failed_when: >
        opn2.failed or
        opn2.changed
      when: not ansible_check_mode

    - name: Changing 1 - adding ranges and a type
      oxlorg.opnsense.frr_ospf_area:
        area: '0.0.0.1'
        ranges: ['10.0.1.0/24', '10.0.2.0/24']
        type: 'stub'
      register: opn3
      failed_when: >
        opn3.failed or
        not opn3.changed
      when: not ansible_check_mode

    - name: Changing 1 - nothing changed
      oxlorg.opnsense.frr_ospf_area:
        area: '0.0.0.1'
        ranges: ['10.0.1.0/24', '10.0.2.0/24']
        type: 'stub'
      register: opn4
      failed_when: >
        opn4.failed or
        opn4.changed
      when: not ansible_check_mode

    - name: Disabling 1
      oxlorg.opnsense.frr_ospf_area:
        area: '0.0.0.1'
        ranges: ['10.0.1.0/24', '10.0.2.0/24']
        type: 'stub'
        enabled: false
      register: opn5
      failed_when: >
        opn5.failed or
        not opn5.changed
      when: not ansible_check_mode

    - name: Disabling 1 - nothing changed
      oxlorg.opnsense.frr_ospf_area:
        area: '0.0.0.1'
        ranges: ['10.0.1.0/24', '10.0.2.0/24']
        type: 'stub'
        enabled: false
      register: opn6
      failed_when: >
        opn6.failed or
        opn6.changed
      when: not ansible_check_mode

    - name: Enabling 1
      oxlorg.opnsense.frr_ospf_area:
        area: '0.0.0.1'
        ranges: ['10.0.1.0/24', '10.0.2.0/24']
        type: 'stub'
      register: opn7
      failed_when: >
        opn7.failed or
        not opn7.changed
      when: not ansible_check_mode

    - name: Adding prefix-lists to link
      oxlorg.opnsense.frr_ospf_prefix_list:
        name: "{{ item }}"
        seq: 10
        action: 'permit'
        network: 'any'
      loop:
        - 'ANSIBLE_TEST_AREA_IN'
        - 'ANSIBLE_TEST_AREA_OUT'
      when: not ansible_check_mode

    - name: Adding 2 - with linked prefix-lists
      oxlorg.opnsense.frr_ospf_area:
        area: '0.0.0.2'
        prefix_list_in: 'ANSIBLE_TEST_AREA_IN'
        prefix_list_out: 'ANSIBLE_TEST_AREA_OUT'
      register: opn8
      failed_when: >
        opn8.failed or
        not opn8.changed
      when: not ansible_check_mode

    - name: Adding 2 - nothing changed
      oxlorg.opnsense.frr_ospf_area:
        area: '0.0.0.2'
        prefix_list_in: 'ANSIBLE_TEST_AREA_IN'
        prefix_list_out: 'ANSIBLE_TEST_AREA_OUT'
      register: opn9
      failed_when: >
        opn9.failed or
        opn9.changed
      when: not ansible_check_mode

    - name: Removing 2
      oxlorg.opnsense.frr_ospf_area:
        area: '0.0.0.2'
        state: 'absent'
      register: opn10
      failed_when: >
        opn10.failed or
        not opn10.changed
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn11
      failed_when: >
        'data' not in opn11 or
        opn11.data | length != 1
      when: not ansible_check_mode

    - name: Cleanup areas
      oxlorg.opnsense.frr_ospf_area:
        area: "{{ item }}"
        state: 'absent'
      loop:
        - '0.0.0.1'
        - '0.0.0.2'
      when: not ansible_check_mode

    - name: Cleanup prefix-lists
      oxlorg.opnsense.frr_ospf_prefix_list:
        name: "{{ item }}"
        state: 'absent'
      loop:
        - 'ANSIBLE_TEST_AREA_IN'
        - 'ANSIBLE_TEST_AREA_OUT'
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_clean1
      failed_when: >
        'data' not in opn_clean1 or
        opn_clean1.data | length != 0
      when: not ansible_check_mode
